name: Sync Docker Hub Description

# Pushes README.md to the Docker Hub repository overview whenever it changes on main.
# Requires DOCKERHUB_TOKEN to be a Docker Hub personal access token with
# "Read, Write, Delete" scope (Docker Hub requires that scope for description updates).

on:
  push:
    branches: [main]
    paths:
      - README.md
      - .github/workflows/dockerhub-description.yml
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: minhion/controlm-cli
          short-description: "Control-M CLI (Automation API) image, Ubuntu 24.04 + JDK 25, optional agent provisioning"
          readme-filepath: ./README.md
